<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/main.css" />
    <script type="module" src="../js/index.js"></script>
    <title>Home</title>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div>
          <p class="app-name">Garage Manager</p>
        </div>
        <nav>
          <ul>
            <li><a href="../index.html">Dashboard</a></li>
            <li><a href="./maintenance.html">Maintenance</a></li>
            <li><a href="./vehicles.html">Vehicles</a></li>
            <li><a href="./projects.html">Projects</a></li>
            <li><a href="./tools.html">Tools</a></li>
          </ul>
        </nav>
      </aside>

      <main>
        <header class="page-header">
          <h1>Vehicles</h1>

          <button class="action-btn" id="openDialog">Add Vehicle</button>
        </header>
        <div id="vehicleContent"></div>
      </main>
      <dialog id="vehicleDialog">
        <form id="vehicleForm">
          <div class="column">
            <label for="type">Type:</label>
            <select id="type" required>
              <option value="">Select an Option</option>

              <optgroup>
                <option value="Truck">Truck</option>
                <option value="Car">Car</option>
                <option value="SUV">SUV</option>
                <option value="van">Vans</option>
                <option value="Motorcycle">Motorcycle</option>
                <option value="Other">Other</option>
              </optgroup>
            </select>
          </div>

          <div class="column">
            <label for="make">Make:</label>
            <input type="text" id="make" required placeholder="Ford" />
          </div>

          <div class="column">
            <label for="model">Model:</label>
            <input type="text" id="model" required placeholder="Mustang" />
          </div>

          <div class="column">
            <label for="year">Year:</label>
            <input type="number" id="year" required placeholder="1969" />
          </div>

          <div class="column">
            <label for="trim">Trim:</label>
            <input type="text" id="trim" required placeholder="Shelby GT500" />
          </div>

          <div class="column">
            <label for="mileage">Mileage:</label>
            <input type="number" id="mileage" required placeholder="184,884" />
          </div>

          <div class="column">
            <label for="nickname">Nickname:</label>
            <input
              type="text"
              id="nickname"
              required
              placeholder="White Lightning"
            />
          </div>

          <div class="column">
            <label for="notes">Notes:</label>
            <textarea id="notes"></textarea>
          </div>

          <div class="action">
            <button type="button" class="action-btn" id="submitDialog">
              Add Vehicle
            </button>
            <button type="button" class="action-btn" id="closeDialog">
              Close
            </button>
          </div>
        </form>
      </dialog>
    </div>
  </body>
</html>
